name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opeenvolgende pushes naar dezelfde branch stapelden runs op.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.14.14

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps (o.a. PyYAML voor meeting-buddy, pystray voor tray-tests).
          python -m pip install -r requirements.txt pytest==9.1.1

      - name: Run tests
        # Draai Qt headless: de niet-interactieve Windows-runner heeft geen
        # system-tray-sessie, waardoor QSystemTrayIcon in de tray-tests een
        # native access violation gaf (pytest stierf zonder samenvatting).
        # faulthandler_timeout: bij een hangende test alle thread-stacks
        # dumpen i.p.v. 15 minuten stilte (de suite heeft join-paden).
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -o faulthandler_timeout=120
